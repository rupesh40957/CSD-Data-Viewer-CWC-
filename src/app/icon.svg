<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Database icon (3 stacked ellipses with connecting lines) -->
  <g transform="translate(256, 256)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-100" rx="120" ry="45" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff"/>
    <!-- Bottom ellipse -->
    <ellipse cx="0" cy="100" rx="120" ry="45" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff"/>
    <!-- Middle ellipse -->
    <ellipse cx="0" cy="0" rx="120" ry="45" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff"/>
    <!-- Left connecting line -->
    <line x1="-120" y1="-100" x2="-120" y2="100"/>
    <!-- Right connecting line -->
    <line x1="120" y1="-100" x2="120" y2="100"/>
  </g>
</svg>
